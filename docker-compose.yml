services:
  leboncoin-service:
    profiles: ['listing-import']
    build: ./services/leboncoin-mcp
    environment:
      LEBONCOIN_SERVICE_TOKEN: ${LEBONCOIN_SERVICE_TOKEN:-}
    ports:
      - '127.0.0.1:8001:8001'
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: predict
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      POSTGRES_DB: predictsci
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U predict -d predictsci']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
